<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A/L Combined Maths Graph Bot</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background-color: #007bff;
            color: white;
            width: 100%;
            text-align: center;
            padding: 20px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            margin: 0;
            font-size: 24px;
        }
        .container {
            max-width: 800px;
            width: 90%;
            margin: 30px auto;
            text-align: center;
        }
        .btn-container {
            margin-bottom: 20px;
        }
        .btn {
            background-color: #28a745;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
            display: inline-block;
        }
        .btn:hover {
            background-color: #218838;
        }
        .iframe-container {
            border: 2px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            background: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        iframe {
            width: 100%;
            height: 600px;
            border: none;
        }
        footer {
            margin-top: 40px;
            color: #777;
            font-size: 14px;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>A/L Combined Mathematics Graph Assistant</h1>
    </header>

    <div class="container">
        <p>ප්‍රස්තාරය ඇඳගැනීම සඳහා පහත ඇති Bot සමඟ Chat කරන්න. (Poe එකෙන් Embed කිරීම Block කර ඇත්නම් බටන් එක ක්ලික් කරන්න)</p>
        
        <div class="btn-container">
            <a href="https://poe.com/botnexus12" target="_blank" class="btn">Open Bot in Full Screen</a>
        </div>

        <div class="iframe-container">
            <iframe src="https://poe.com/botnexus12"></iframe>
        </div>
    </div>

    <footer>
        <p>Created for A/L Combined Maths Students</p>
    </footer>

</body>
</html>
